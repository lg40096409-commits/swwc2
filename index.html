<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d0c">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>SOSAFE Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;600;700;900&display=swap">
<style>
/* Layout: one Apple Watch 44mm screen (184×224pt) drawn at true proportions, scaled to fit the viewer; single dark world like the watch itself */
:root{
  --ground:#0b0d0c;          /* page behind the device */
  --ground-2:#141816;
  --case:#1b1d1c;            /* watch case */
  --screen:#000000;
  --fg:#ffffff;
  --ink:#1c1c1c;            /* near-black gray for text on bright surfaces */
  --muted:#aeaeae;
  --dim:#8b8a8a;
  --mint:#4cffa4;            /* SOSAFE signature green */
  --mint-deep:#34bf78;
  --track:#3a3d3c;
  --chip:#2a2a2a;
  --g-exit-a:#31db92; --g-exit-b:#96deea;
  --g-fire-a:#ff8a00; --g-fire-b:#ffd338;
  --g-aed-a:#ff5a4a;  --g-aed-b:#ff7bd5;
  --danger:#ff5b43;
  --ui:'Pretendard','Gothic A1','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --clock:-apple-system,'SF Pro Text',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{word-break:keep-all;height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--ground-2),var(--ground) 60%);color:var(--fg);font-family:var(--ui);padding-inline:16px;padding-block:0;overflow-x:hidden;overflow-y:auto}
.stage{min-height:100%;padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.caption{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.caption h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
.caption p{margin:0;font-size:12px;color:var(--muted);text-wrap:balance}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toolbar button{font:600 12px var(--ui);color:var(--muted);background:transparent;border:1px solid #ffffff26;border-radius:999px;padding:6px 12px;cursor:pointer}
.toolbar button:hover{color:var(--fg);border-color:#ffffff55}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

/* device: logical size, scaled by --s. Case 208x248, 4pt metal edge + 8pt black glass bezel around the 184x224 display */
.fit{width:calc(224px * var(--s,1.6));height:calc(252px * var(--s,1.6));position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:224px;height:252px;transform:scale(var(--s,1.6));transform-origin:0 0}
.case{position:absolute;left:0;top:2px;width:208px;height:248px;border-radius:54px;background:linear-gradient(150deg,#4a4e4d 0%,#26292a 22%,#1a1c1d 55%,#2e3132 85%,#43474a 100%);box-shadow:0 24px 50px #000b,0 2px 0 #ffffff10 inset,0 -2px 0 #00000080 inset}
.glass{position:absolute;left:4px;top:6px;width:200px;height:240px;border-radius:50px;background:#050505;box-shadow:inset 0 0 0 1px #ffffff12,inset 0 1px 1px #ffffff1c}
.glass::after{content:"";position:absolute;inset:0;border-radius:50px;background:linear-gradient(160deg,#ffffff10 0%,transparent 35%);pointer-events:none;z-index:3}
.crown{position:absolute;left:205px;top:60px;width:13px;height:34px;border-radius:4px 6px 6px 4px;background:linear-gradient(90deg,#2a2d2e,#55595a 55%,#2a2d2e);border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff14}
.crown::after{content:"";position:absolute;inset:4px 2px 4px 4px;background:repeating-linear-gradient(0deg,#00000066 0 1px,transparent 1px 2.5px);border-radius:2px}
.sidebtn{position:absolute;left:206px;top:118px;width:5px;height:42px;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#2a2d2e,#4a4e4f)}
.screen{position:absolute;left:12px;top:14px;width:184px;height:224px;background:var(--screen);border-radius:36px;overflow:hidden}

/* views */
.view{position:absolute;inset:0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;transition:opacity .22s ease,transform .22s ease}
.view[hidden]{display:none!important}
.view.enter{opacity:0;transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.view{transition:none}}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:18px;padding-inline:8px 6px}
.clock{font:600 14px var(--clock);font-variant-numeric:tabular-nums}
.back{display:flex;align-items:center;gap:3px;line-height:1;background:none;border:0;padding:0;color:var(--mint);font:700 14px var(--ui);cursor:pointer}
.back svg{display:block;width:7px;height:11px;flex:none;position:relative;top:-.8px}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.screen{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* phone mode: drop the watch case, let the watch display fill the phone */
html.phone body{overflow:hidden;padding-inline:0}
html.phone .stage{height:100%;min-height:0;padding-block:12px;gap:14px;justify-content:center}
html.phone .caption,html.phone .case,html.phone .glass,html.phone .crown,html.phone .sidebtn{display:none}
html.phone .fit{width:calc(184px * var(--s));height:calc(224px * var(--s))}
html.phone .device{width:184px;height:224px}
html.phone .screen{left:0;top:0;border-radius:38px;box-shadow:0 0 0 1px #ffffff14}
.homebtn{display:none}
html.phone .homebtn{display:inline-flex}
html.phone .toolbar button{font-size:15px;padding:10px 20px}

/* home */
.ticket{color:var(--ink);display:flex;align-items:stretch;height:46px;border-radius:12px;overflow:hidden;background:linear-gradient(90deg,var(--g-exit-a),var(--g-exit-b));flex:none;transition:filter .3s}
.ticket .body{flex:1;display:flex;align-items:center;gap:6px;padding-left:8px;min-width:0}
.ticket .body svg{width:22px;height:23px;flex:none}
.t1{font-size:12px;letter-spacing:0;font-weight:700;font-weight:600;line-height:1.2;white-space:nowrap}
.t2{font-size:10px;font-weight:600;opacity:.85;line-height:1.2}
.stub{width:34px;flex:none;border:0;border-left:1px dashed #1c1c1c66;background:#ffffff40;color:var(--ink);font:700 12px var(--ui);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.ticket.used{filter:saturate(.35) brightness(.8)}
.label{font-size:13px;font-weight:600}
.days{display:flex;justify-content:center;gap:8px}
.day{width:44px;height:44px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--chip);border:1px solid #ffffff26;color:var(--fg);font-family:var(--ui);padding:0}
.day b{font-size:17px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.day small{font-size:10px;font-weight:600;line-height:1.2}
.day.future{color:#ffffff99}
.day.today{background:var(--mint);border-color:transparent;color:var(--ink);box-shadow:0 0 8px #4cffa480;cursor:pointer}
.day.today.done{background:#1e3a2c;color:var(--mint);box-shadow:none}
.day svg{width:10px;height:10px}
.sosbtn{height:40px;border-radius:20px;background:var(--mint);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin-top:auto}
.sosbtn svg{width:56px;height:18px}
.sosbtn:active{transform:scale(.97)}

/* sos */
.loc .k{font-size:10px;font-weight:500;color:var(--muted);line-height:1.2}
.loc .v{font-size:13px;font-weight:600;line-height:1.25}
.slider{position:relative;height:40px;border-radius:20px;background:var(--track);box-shadow:inset 0 2px 8px #00000073;flex:none;touch-action:none;user-select:none}
.slider .hint{white-space:nowrap;letter-spacing:0;position:absolute;inset:0 6px 0 62px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:opacity .15s}
.slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:20px;background:#4cffa433;width:0}
.knob{position:absolute;left:4px;top:4px;width:56px;height:32px;border-radius:16px;background:var(--mint);border:0;color:var(--ink);font:800 18px var(--ui);cursor:grab;touch-action:none;box-shadow:0 1px 4px #0006}
.knob.anim{transition:transform .25s ease}
.knob:active{cursor:grabbing}
.cards{display:flex;flex-direction:column;gap:5px}
.card{color:var(--ink);display:flex;align-items:stretch;height:30px;border-radius:10px;overflow:hidden}
.card .name{flex:1;display:flex;align-items:center;gap:4px;padding-left:5px;font-size:10.5px;font-weight:700;white-space:nowrap;min-width:0;letter-spacing:0}
.card .name svg{width:18px;height:18px;flex:none}
.card .act{width:28px;flex:none;border:0;border-left:1px dashed #1c1c1c66;background:#ffffff40;color:var(--ink);font:700 10.5px var(--ui);cursor:pointer;padding:0}
.card .act:active,.stub:active{background:#ffffff55}
.c-exit{background:linear-gradient(90deg,var(--g-exit-a),var(--g-exit-b))}
.c-fire{background:linear-gradient(90deg,var(--g-fire-a),var(--g-fire-b))}
.c-aed{background:linear-gradient(90deg,var(--g-aed-a),var(--g-aed-b))}

/* emergency */
#v-call{background:var(--screen)}
.glow{position:absolute;border-radius:50%;filter:blur(30px);pointer-events:none}
.pill{position:relative;display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;padding:0 0 0 5px;background:#0000004d;border:1px solid #ffffff24;color:var(--fg);font:700 15px var(--ui);cursor:pointer;flex:none;text-align:left}
.pill .ic{width:38px;height:38px;border-radius:19px;background:var(--mint-deep);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex:none;box-shadow:0 2px 4px #0004}
.pill .ic svg{width:20px;height:20px}
.pill:active{background:#ffffff14}
.cancel{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--fg);font:700 12px var(--ui);cursor:pointer;position:relative}
.cancel span{width:40px;height:40px;border-radius:20px;background:#313131a0;border:1px solid #ffffff33;display:flex;align-items:center;justify-content:center}
.cancel svg{width:15px;height:15px}

/* dialing / detail */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;position:relative}
.ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--mint-deep);font:900 26px var(--ui);font-variant-numeric:tabular-nums;position:relative}
.ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #4cffa466;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring::before{animation:none}}
.num{font-size:24px;font-weight:700;user-select:all;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted);line-height:1.35}
.endbtn{height:36px;border-radius:18px;border:0;background:var(--danger);color:var(--fg);font:700 14px var(--ui);cursor:pointer;flex:none}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:6px}
.scroll::-webkit-scrollbar{display:none}
.dtitle{font-size:15px;font-weight:700;margin:0 0 6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.steps li{display:flex;gap:6px;align-items:flex-start;background:#1c1c1c;border-radius:10px;padding:7px 8px;font-size:12px;line-height:1.35}
.steps li b{flex:none;width:16px;height:16px;border-radius:8px;background:var(--mint);color:var(--ink);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dir{width:70px;height:70px;border-radius:50%;background:#151515;border:1px solid #ffffff1f;display:flex;align-items:center;justify-content:center}
.dir svg{display:block;width:40px;height:40px;transform-origin:50% 50%;transition:opacity .3s}
.dir{position:relative}
.dir::before{content:"";position:absolute;top:4px;left:50%;width:2px;height:6px;margin-left:-1px;border-radius:1px;background:#ffffff55}
.savebtn{margin-top:4px;border:1px solid #4cffa466;background:#4cffa41a;color:var(--mint);font:700 10.5px var(--ui);border-radius:999px;padding:5px 10px;cursor:pointer}
.dist{display:flex;align-items:baseline;justify-content:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.dist small{font-size:12px;margin-left:2px}
#dist:not(:has(small)){font-size:15px}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);background:#1f1f1f;border:1px solid #4cffa455;color:var(--mint);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

</head>
<body>
<main class="stage">
  <div class="caption">
    <h1>SOSAFE · Apple Watch 44mm</h1>
    <p>화면을 직접 눌러보세요. 옆의 용두(크라운)를 누르면 홈으로 돌아가요.</p>
  </div>

  <div class="fit" id="fit">
    <div class="device" id="device">
      <div class="case"></div><div class="glass"></div>
      <button class="crown" id="crown" aria-label="홈으로"></button>
      <div class="sidebtn" aria-hidden="true"></div>
      <div class="screen" id="screen">

        <!-- HOME -->
        <section class="view" id="v-home" aria-label="홈">
          <div class="hdr">
            <svg width="66" height="11" viewBox="0 0 82 14" fill="none" aria-label="S.O.SAFE"><path d="M0.265897 10.4861H6.62882C7.38131 10.4861 7.88119 10.0628 7.88119 9.42651C7.88119 8.79021 7.37865 8.36691 6.62882 8.36691H3.96985C1.58741 8.36691 0 6.77077 0 4.38465C0 1.99853 1.58741 0.515625 3.96985 0.515625H10.4737V3.42481H4.67979C3.9273 3.42481 3.42742 3.84811 3.42742 4.48441C3.42742 5.12071 3.92996 5.54401 4.67979 5.54401H6.9346C9.56698 5.54401 11.3059 7.14015 11.3059 9.52627C11.3059 11.9124 9.56432 13.3953 6.9346 13.3953H0.265897V10.4861Z" fill="#FFFEFE"/><path d="M28.7759 6.69066C28.7759 10.4841 25.8595 13.3949 21.8381 13.3949C17.8168 13.3949 14.9004 10.4868 14.9004 6.69066C14.9004 2.8945 17.8168 0 21.8381 0C25.8595 0 28.7759 2.90804 28.7759 6.68795V6.69066ZM25.292 6.69066C25.292 4.54077 23.9197 2.84035 21.8381 2.84035C19.7565 2.84035 18.3843 4.54077 18.3843 6.69066C18.3843 8.84055 19.7565 10.5545 21.8381 10.5545C23.9197 10.5545 25.292 8.85409 25.292 6.69066Z" fill="#FFFEFE"/><path d="M32.1246 10.4861H38.489C39.2417 10.4861 39.7417 10.0628 39.7417 9.42651C39.7417 8.79021 39.2417 8.36691 38.489 8.36691H35.8294C33.4464 8.36691 31.8613 6.77077 31.8613 4.38465C31.8613 1.99853 33.4491 0.515625 35.8294 0.515625H42.3348V3.42481H36.5396C35.7869 3.42481 35.2869 3.84811 35.2869 4.48441C35.2869 5.12071 35.7896 5.54401 36.5396 5.54401H38.7949C41.4279 5.54401 43.1673 7.14015 43.1673 9.52627C43.1673 11.9124 41.4252 13.3953 38.7949 13.3953H32.1246V10.4861Z" fill="#FFFEFE"/><path d="M57.0445 13.3949H53.5662V10.4777H48.7029V13.3949H45.2246V5.86416C45.2246 2.40058 47.6121 0 51.1332 0C54.6543 0 57.0418 2.40058 57.0418 5.86416V13.3949H57.0445ZM48.7056 7.51711H53.5688V5.57598C53.5688 4.21121 52.7079 2.96062 51.1385 2.96062C49.5692 2.96062 48.7083 4.21121 48.7083 5.57598V7.51711H48.7056Z" fill="#FFFEFE"/><path d="M62.0918 6.09367H68.7198V8.9744H62.0918V13.3953H58.5859V3.62293C58.5859 1.75909 59.8408 0.515625 61.7216 0.515625H68.8641V3.42603H62.9492C62.4348 3.42603 62.0945 3.76589 62.0945 4.27298V6.09637L62.0918 6.09367Z" fill="#FFFEFE"/><path d="M74.7467 10.4861H81.2002V13.3953H73.528C71.6567 13.3953 70.4082 12.1524 70.4082 10.2893V0.515625H81.2002V3.42481H73.8963V5.38763H81.0594V8.24019H73.8963V9.63682C73.8963 10.1464 74.2375 10.4834 74.7467 10.4834V10.4861Z" fill="#FFFEFE"/><path d="M13.8755 12.8811C14.4431 12.8811 14.9033 12.4197 14.9033 11.8507C14.9033 11.2816 14.4431 10.8203 13.8755 10.8203C13.3078 10.8203 12.8477 11.2816 12.8477 11.8507C12.8477 12.4197 13.3078 12.8811 13.8755 12.8811Z" fill="#FFFEFE"/><path d="M29.8032 12.8811C30.3709 12.8811 30.831 12.4197 30.831 11.8507C30.831 11.2816 30.3709 10.8203 29.8032 10.8203C29.2356 10.8203 28.7754 11.2816 28.7754 11.8507C28.7754 12.4197 29.2356 12.8811 29.8032 12.8811Z" fill="#FFFEFE"/></svg>
            <span class="clock" data-clock>9:41</span>
          </div>
          <div class="ticket" id="ticket">
            <div class="body">
              <svg viewBox="0 0 44 46" fill="none" aria-hidden="true"><use href="#i-exit"/></svg>
              <div><div class="t1">비상구 인지 티켓</div><div class="t2">예술대학 31동 1층</div></div>
            </div>
            <button class="stub" id="ticketBtn">확인</button>
          </div>
          <div class="label">오늘의 출석체크</div>
          <div class="days" id="days"></div>
          <button class="sosbtn" id="toSos" aria-label="S.O.S 열기">
            <svg viewBox="0 0 40 13" fill="none" aria-hidden="true"><use href="#i-sos"/></svg>
          </button>
          <div class="toast" id="toast" role="status"></div>
        </section>

        <!-- SOS -->
        <section class="view" id="v-sos" aria-label="SOS" hidden style="gap:6px">
          <div class="hdr">
            <button class="back" data-go="home"><svg viewBox="0 0 8 12" fill="none"><path d="M6.5 1.5 2 6l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>SOS</button>
            <span class="clock" data-clock>9:41</span>
          </div>
          <div class="loc"><div class="k">내 현재위치</div><div class="v">예술대학 1층 · 비상구 18m</div></div>
          <div class="slider" id="slider">
            <div class="fill" id="fill"></div>
            <div class="hint" id="hint">밀어서 긴급 신고</div>
            <button class="knob" id="knob" aria-label="밀어서 긴급 신고 (Enter로도 실행)">SOS</button>
          </div>
          <div class="cards">
            <div class="card c-exit">
              <div class="name"><svg viewBox="0 0 44 46" fill="none" aria-hidden="true"><use href="#i-exit"/></svg>비상구 찾기</div>
              <button class="act" data-detail="exit-loc">위치</button>
            </div>
            <div class="card c-fire">
              <div class="name"><svg viewBox="0 0 44 44" fill="none" aria-hidden="true"><use href="#i-fire"/></svg>화재 발생</div>
              <button class="act" data-detail="fire-how">요령</button>
              <button class="act" data-detail="fire-loc">위치</button>
            </div>
            <div class="card c-aed">
              <div class="name"><svg viewBox="0 0 44 44" fill="none" aria-hidden="true"><use href="#i-aed"/></svg>심정지 환자 발생</div>
              <button class="act" data-detail="aed-how">요령</button>
              <button class="act" data-detail="aed-loc">위치</button>
            </div>
          </div>
        </section>

        <!-- EMERGENCY CALL PICKER -->
        <section class="view" id="v-call" aria-label="긴급 신고" hidden>
          <div class="glow" style="left:-40px;top:30px;width:150px;height:110px;background:#2f8a5c8c"></div>
          <div class="glow" style="left:80px;top:110px;width:130px;height:100px;background:#3d6b5873"></div>
          <div class="glow" style="left:-20px;top:150px;width:140px;height:90px;background:#1f6b4580"></div>

<script>
(function(){
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

  /* ---------- fit device to viewport ---------- */
  function fit(){
    const W=document.documentElement.clientWidth, H=document.documentElement.clientHeight;
    const phone=W<560 && (matchMedia('(pointer:coarse)').matches || W<480);
    document.documentElement.classList.toggle('phone',phone);
    let sF;
    if(phone){
      const reserved=24+14+44; // padding, gap, toolbar
      sF=Math.min((W-24)/184,(H-reserved)/224);
    }else{
      const cap=document.querySelector('.caption'); cap.hidden = H<560;
      const reserved=(cap.hidden?0:cap.offsetHeight+18)+28+18+24;
      const sw=(W-32)/224, sh=(H-reserved)/252;
      const s0=Math.max(1.5,Math.min(sw,sh,3));
      sF=Math.min(s0,Math.max(sw,1.2));
    }
    document.documentElement.style.setProperty('--s',sF.toFixed(3));
  }
  addEventListener('resize',fit); fit();

  /* ---------- live clock ---------- */
  function tick(){const d=new Date();const t=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');$$('[data-clock]').forEach(e=>e.textContent=t);}
  tick(); setInterval(tick,10000);

  /* ---------- navigation ---------- */
  let current='home';
  function go(name){
    if(name===current) return;
    $('#v-'+current).hidden=true;
    const v=$('#v-'+name); v.hidden=false; v.classList.add('enter');
    requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.remove('enter')));
    current=name;
    if(name==='sos') resetSlider(false);
    if(name!=='dial') stopDial();
    if(name!=='detail' && typeof stopCompass==='function') stopCompass();
  }
  document.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go);});
  $('#crown').addEventListener('click',()=>go('home'));
  $('#homeBtn').addEventListener('click',()=>go('home'));
  $('#toSos').addEventListener('click',()=>go('sos'));

  /* ---------- toast ---------- */
  let tt;
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600);}

  /* ---------- home: ticket + attendance ---------- */
  let ticketUsed=false, checked=false;
  $('#ticketBtn').addEventListener('click',()=>{
    if(ticketUsed){toast('이미 확인한 티켓이에요');return;}
    ticketUsed=true; $('#ticket').classList.add('used'); $('#ticketBtn').textContent='완료'; toast('+300 P 적립');
  });
  const EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const check='<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.3 2.3L9.5 3.8" stroke="#4CFFA4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function renderDays(){
    const today=new Date(); const box=$('#days'); box.innerHTML='';
    [-1,0,1].forEach(off=>{
      const d=new Date(today); d.setDate(today.getDate()+off);
      const el=document.createElement(off===0?'button':'div');
      el.className='day '+(off<0?'past':off===0?'today':'future')+(off===0&&checked?' done':'');
      el.innerHTML='<b>'+d.getDate()+'</b>'+(off<0?check:off===0&&checked?check:'<small>'+EN[d.getDay()]+'</small>');
      if(off===0){el.setAttribute('aria-label','오늘 출석체크');el.addEventListener('click',()=>{if(checked){toast('오늘은 출석 완료');return;}checked=true;renderDays();toast('출석 완료 +50 P');});}
      box.appendChild(el);
    });
  }
  renderDays();

  /* ---------- SOS slider ---------- */
  const slider=$('#slider'), knob=$('#knob'), fill=$('#fill'), hint=$('#hint');
  const MAX=184-20-8-56; // track width - knob - padding
  let dragging=false, startX=0, pos=0;
  const scale=()=>slider.getBoundingClientRect().width/slider.offsetWidth;
  function setPos(x){pos=Math.max(0,Math.min(MAX,x));knob.style.transform='translateX('+pos+'px)';fill.style.width=(pos+60)+'px';hint.style.opacity=1-pos/MAX;}
  function resetSlider(anim=true){knob.classList.toggle('anim',anim);setPos(0);}
  knob.addEventListener('pointerdown',e=>{dragging=true;knob.classList.remove('anim');startX=e.clientX/scale()-pos;knob.setPointerCapture(e.pointerId);});
  knob.addEventListener('pointermove',e=>{if(dragging) setPos(e.clientX/scale()-startX);});
  function release(){if(!dragging)return;dragging=false;if(pos>=MAX*0.9){setPos(MAX);setTimeout(()=>go('call'),120);}else resetSlider(true);}
  knob.addEventListener('pointerup',release); knob.addEventListener('pointercancel',release);
  knob.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();knob.classList.add('anim');setPos(MAX);setTimeout(()=>go('call'),250);}});
  knob.addEventListener('click',e=>e.preventDefault());

  /* ---------- dialing (demo only, no real call) ---------- */
  let dialTimer=null, phase='count';
  function stopDial(){clearInterval(dialTimer);dialTimer=null;}
  $$('[data-dial]').forEach(b=>b.addEventListener('click',()=>{
    const num=b.dataset.dial; $('#dialNum').textContent=num; go('dial');
    let n=3; phase='count'; $('#ring').textContent=n; $('#dialSub').textContent='3초 후 연결돼요'; $('#endBtn').textContent='취소';
    stopDial();
    dialTimer=setInterval(()=>{
      if(phase==='count'){n--; if(n>0){$('#ring').textContent=n;$('#dialSub').textContent=n+'초 후 연결돼요';}
        else{phase='talk';n=0;$('#ring').textContent='00:00';$('#ring').style.fontSize='17px';$('#dialSub').innerHTML=(num==='119'?'119 종합상황실':'112 경찰청')+' 통화 중';$('#endBtn').textContent='통화 종료';}}
      else{n++;$('#ring').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
    },1000);
  }));
  $('#endBtn').addEventListener('click',()=>{stopDial();$('#ring').style.fontSize='';go(phase==='talk'?'home':'call');});

  /* ---------- detail screens ---------- */
  const arrow='<svg viewBox="0 0 40 40" fill="none" id="arrow"><path d="M20 6 31 34 20 28 9 34Z" fill="#4cffa4"/></svg>';
  const D={
    'fire-how':{h:'화재',html:'<p class="dtitle">소화기 사용법</p><ol class="steps"><li><b>1</b>큰 소리로 "불이야!" 알리고 119 신고</li><li><b>2</b>안전핀을 뽑아요</li><li><b>3</b>노즐을 불 쪽으로 향해요</li><li><b>4</b>손잡이를 힘껏 움켜쥐어요</li><li><b>5</b>빗자루로 쓸듯이 골고루 뿌려요</li><li><b>6</b>불이 커지면 바로 대피하세요</li></ol>'},
    'aed-how':{h:'심정지',html:'<p class="dtitle">심폐소생술 순서</p><ol class="steps"><li><b>1</b>어깨를 두드리며 반응 확인</li><li><b>2</b>119 신고와 AED 요청을 부탁해요</li><li><b>3</b>가슴 중앙을 5cm 깊이로 분당 100~120회 압박</li><li><b>4</b>AED가 오면 전원을 켜고 음성 안내를 따라요</li><li><b>5</b>구급대 도착까지 압박을 멈추지 마세요</li></ol>'}
  };
  const PLACES={'exit-loc':{key:'exit',h:'비상구',name:'비상구'},'fire-loc':{key:'fire',h:'소화전',name:'소화전'},'aed-loc':{key:'aed',h:'AED',name:'AED'}};

  /* ---------- real compass: GPS + device heading ---------- */
  const TKEY='sosafe-targets';
  const loadT=()=>{try{return JSON.parse(localStorage.getItem(TKEY))||{}}catch(e){return {}}};
  const saveT=t=>{try{localStorage.setItem(TKEY,JSON.stringify(t));return true}catch(e){return false}};
  let targets=loadT();
  const C={place:null,pos:null,acc:null,heading:null,shown:null,geoId:null,oriOn:false,err:null,raf:0};
  const rad=x=>x*Math.PI/180, deg=x=>x*180/Math.PI;
  function distM(a,b){const R=6371000,dLa=rad(b.lat-a.lat),dLo=rad(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
  function bearing(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (deg(Math.atan2(y,x))+360)%360;}
  function onOri(e){
    let h=null;
    if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;                 // iOS
    else if(e.absolute && typeof e.alpha==='number') h=(360-e.alpha)%360;                    // Android absolute
    if(h==null) return;
    const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    C.heading=(h+so+360)%360;
  }
  function startOrientation(){
    if(C.oriOn) return;
    const go2=()=>{C.oriOn=true;addEventListener('deviceorientationabsolute',onOri,true);addEventListener('deviceorientation',onOri,true);};
    try{
      if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted') go2(); else C.err='나침반 권한이 거부됐어요';}).catch(()=>{});
      }else if(window.DeviceOrientationEvent) go2();
    }catch(e){}
  }
  function startGeo(){
    if(C.geoId!=null) return;
    if(!navigator.geolocation){C.err='이 브라우저는 위치를 지원하지 않아요';return;}
    try{
      C.geoId=navigator.geolocation.watchPosition(p=>{C.pos={lat:p.coords.latitude,lng:p.coords.longitude};C.acc=p.coords.accuracy;C.err=null;},
        e=>{C.err=e.code===1?'위치 권한이 꺼져 있어요':'위치를 찾지 못했어요';},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});
    }catch(e){C.err='이 화면에서는 위치를 쓸 수 없어요';}
  }
  function stopCompass(){
    if(C.geoId!=null){try{navigator.geolocation.clearWatch(C.geoId)}catch(e){} C.geoId=null;}
    if(C.oriOn){removeEventListener('deviceorientationabsolute',onOri,true);removeEventListener('deviceorientation',onOri,true);C.oriOn=false;}
    cancelAnimationFrame(C.raf); C.place=null; C.shown=null;
  }
  function renderCompass(){
    const P=PLACES[C.place]; if(!P) return;
    const t=targets[P.key];
    $('#dBody').innerHTML='<div class="center"><div class="dir" id="dir">'+arrow+'</div><div class="dist" id="dist">--</div><div class="sub" id="csub">위치 확인 중…</div><button class="savebtn" id="saveHere"></button></div>';
    $('#saveHere').textContent=t?'여기로 다시 저장':'여기를 '+P.name+'로 저장';
    $('#saveHere').addEventListener('click',()=>{
      if(!C.pos){toast('위치를 아직 못 찾았어요');return;}
      targets[P.key]={lat:C.pos.lat,lng:C.pos.lng}; const ok=saveT(targets);
      toast(ok?P.name+' 위치 저장됨':'저장 실패 (이 브라우저는 저장 불가)'); $('#saveHere').textContent='여기로 다시 저장';
    });
    loop();
  }
  function loop(){
    const P=PLACES[C.place]; if(!P) return;
    const t=targets[P.key], a=$('#arrow'), dist=$('#dist'), sub=$('#csub'); if(!a) return;
    let target=null, msg='';
    if(C.err && !C.pos){ msg=C.err; }
    else if(!C.pos){ msg='위치 확인 중…'; }
    else if(!t){ msg=P.name+' 앞에 서서 저장해 주세요'; dist.textContent='위치 미등록'; }
    else{
      const d=distM(C.pos,t), br=bearing(C.pos,t);
      dist.innerHTML=(d<1000?Math.round(d):(d/1000).toFixed(1))+'<small>'+(d<1000?'m':'km')+'</small>';
      if(C.heading!=null){ target=br-C.heading; msg=(d<=Math.max(5,(C.acc||0)*0.6)?'도착했어요':'화살표 방향으로 이동하세요')+'<br>GPS 오차 ±'+Math.round(C.acc||0)+'m'; }
      else { target=br; msg='나침반 센서가 없어 북쪽(위) 기준이에요<br>GPS 오차 ±'+Math.round(C.acc||0)+'m'; }
    }
    if(sub.innerHTML!==msg) sub.innerHTML=msg;
    if(target!=null){
      if(C.shown==null) C.shown=target;
      let diff=((target-C.shown)%360+540)%360-180; C.shown+=diff*0.2;   // smooth, shortest way round
      a.style.transform='rotate('+C.shown.toFixed(1)+'deg)'; a.style.opacity=1;
    } else a.style.opacity=.25;
    C.raf=requestAnimationFrame(loop);
  }

  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-detail]'); if(!b) return;
    const key=b.dataset.detail;
    if(PLACES[key]){
      startOrientation();            // must run inside the tap for iOS permission
      startGeo();
      $('#dHead').textContent=PLACES[key].h; go('detail'); C.place=key; C.shown=null; renderCompass(); return;
    }
    const d=D[key]; $('#dHead').textContent=d.h; $('#dBody').innerHTML=d.html; $('#dBody').scrollTop=0; go('detail');
  });

  /* ---------- reset ---------- */
  $('#reset').addEventListener('click',()=>{ticketUsed=false;checked=false;$('#ticket').classList.remove('used');$('#ticketBtn').textContent='확인';renderDays();stopDial();go('home');});
})();
</script>
